version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      - redis

  frontend:
    build: ./job-frontend
    ports:
      - "5173:80" # Maps nginx port 80 to your local 5173
    depends_on:
      - backend

  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"